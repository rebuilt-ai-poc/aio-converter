name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Sync backend
        working-directory: backend
        run: uv sync
      - name: Run pytest
        working-directory: backend
        run: uv run pytest -q
        # Native-tool integration tests auto-skip when binaries are absent;
        # a separate workflow can install Pandoc/Typst/LibreOffice/resvg to run them.

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type-check + build
        working-directory: frontend
        run: npm run build
